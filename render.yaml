services:
  - type: web
    name: british-airways-virtual
    runtime: node
    # Render's persisted build cache can otherwise retain an outdated Next.js
    # server bundle after a deployment. Rebuild the generated output cleanly
    # so page code and newly added public assets always ship together.
    buildCommand: npm ci && rm -rf .next && npm run build
    startCommand: npm run start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BAV_PILOT_SESSION_SECRET
        generateValue: true
      - key: BAV_STAFF_SESSION_SECRET
        generateValue: true
      - key: BAV_SMTP_HOST
        value: smtp.gmail.com
      - key: BAV_SMTP_PORT
        value: "465"
      - key: BAV_SMTP_SECURE
        value: "true"
      - key: BAV_SMTP_USER
        sync: false
      - key: BAV_SMTP_PASSWORD
        sync: false
      - key: BAV_EMAIL_FROM
        value: British Airways Virtual <support@britishairwaysva.co.uk>
      - key: BAV_EMAIL_REPLY_TO
        value: support@britishairwaysva.co.uk
      # The private-preview reset flow deliberately sends anonymously. Configure
      # this address as an approved alias with the existing SMTP provider.
      - key: BAV_CLOSED_BETA_EMAIL_FROM
        value: Private Aviation Preview <no-reply@britishairwaysva.co.uk>
      - key: BAV_CLOSED_BETA_EMAIL_REPLY_TO
        value: no-reply@britishairwaysva.co.uk
      - key: BAV_PUBLIC_SITE_URL
        value: https://virtualairline.co.uk
      - key: BAV_PASSWORD_RESET_SECRET
        generateValue: true
      - key: BAV_CLOSED_BETA_ENABLED
        value: "enabled"
      # Optional, read-only duty/rest guidance. It is only shown when a pilot
      # chooses the Realistic Operations Career experience.
      - key: BAV_FEATURE_CAREER_ADVANCED_OPERATIONS
        value: "enabled"
      - key: BAV_FEATURE_CAREER_MENTORING
        value: "enabled"
      - key: SIMBRIEF_API_KEY
        sync: false
