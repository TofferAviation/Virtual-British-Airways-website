name: BAV ACARS CI

on:
  push:
    paths:
      - "clients/bav-acars/**"
      - ".github/workflows/acars-ci.yml"
  pull_request:
    paths:
      - "clients/bav-acars/**"
      - ".github/workflows/acars-ci.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore clients/bav-acars/BavAcars.Client.csproj
      - name: Build
        run: dotnet build clients/bav-acars/BavAcars.Client.csproj -c Release --no-restore
      - name: Publish Windows x64
        run: dotnet publish clients/bav-acars/BavAcars.Client.csproj -c Release -r win-x64 --self-contained true /p:PublishSingleFile=true -o artifacts/bav-acars-win-x64
      - name: Upload Windows test build
        uses: actions/upload-artifact@v4
        with:
          name: FreeFlight-BAV-ACARS-v1.0.0-win-x64
          path: artifacts/bav-acars-win-x64/**
          if-no-files-found: error
